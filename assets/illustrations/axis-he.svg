<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Abstract illustration of heat contours crossed by a dotted human movement trajectory.">
  <!-- Faint reference grid -->
  <g stroke="rgba(24,24,24,0.07)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>
  <!-- Heat contours (nested irregular isolines) -->
  <g fill="none" stroke="#d75b32" stroke-width="2.5">
    <path opacity="0.35" d="M 330 60 C 480 40 640 90 690 170 C 740 250 660 340 520 355 C 380 370 240 330 200 240 C 165 160 190 80 330 60 Z"/>
    <path opacity="0.55" d="M 360 100 C 470 85 590 120 630 180 C 670 240 610 300 500 315 C 390 330 290 300 260 235 C 232 175 255 115 360 100 Z"/>
    <path opacity="0.8" d="M 395 140 C 470 130 545 155 570 195 C 597 238 555 275 480 283 C 407 291 335 268 320 220 C 306 176 325 150 395 140 Z"/>
    <ellipse cx="450" cy="210" rx="60" ry="32" opacity="1"/>
  </g>
  <circle cx="450" cy="210" r="6" fill="#d75b32"/>
  <!-- Mobility trajectory: dashed path with waypoints, left to right -->
  <path d="M 60 330 C 200 300 260 240 380 250 C 500 260 520 170 660 160 C 800 150 860 230 1000 210 C 1070 200 1110 170 1150 150"
        fill="none" stroke="#181818" stroke-width="2" stroke-dasharray="1 10" stroke-linecap="round"/>
  <g fill="#181818">
    <circle cx="60" cy="330" r="5"/>
    <circle cx="380" cy="250" r="5"/>
    <circle cx="660" cy="160" r="5"/>
    <circle cx="1000" cy="210" r="5"/>
  </g>
  <path d="M 1150 150 l -18 2 l 10 14 Z" fill="#181818"/>
  <!-- Secondary settlement marks -->
  <g fill="none" stroke="#6b6b67" stroke-width="1.5">
    <rect x="840" y="290" width="26" height="26"/>
    <rect x="890" y="270" width="18" height="46"/>
    <rect x="930" y="300" width="34" height="16"/>
    <rect x="140" y="120" width="22" height="22"/>
    <rect x="180" y="132" width="14" height="10"/>
  </g>
</svg>
