project:
  type: website
  output-dir: _site
  # Only .qmd files are site pages; .md files (docs/, README, AGENTS, CLAUDE) are
  # internal documentation and must not be published.
  render:
    - "**/*.qmd"
  # PNG social cards; og-images.ts points SVG Open Graph images at them.
  resources:
    - "assets/social/*.png"
  post-render: scripts/og-images.ts

# Execution policy: computational documents are rendered locally and frozen.
# CI renders with Quarto only (no R / Python toolchain). See docs/architecture.md.
execute:
  freeze: auto

lang: en

website:
  title: "Shinya Uryu"
  site-url: https://uribo.github.io
  description: "Understanding human–environment–information systems through data"
  repo-url: https://github.com/uribo/uribo.github.io
  image: /assets/social/social-preview.png  # 1280x640; source: assets/social/social-preview.html
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  search:
    location: navbar
    type: overlay
  navbar:
    pinned: true
    left:
      - text: Research
        href: research/index.qmd
      - text: Publications
        href: publications/index.qmd
      - text: "Data & Software"
        href: data-software/index.qmd
      - text: Notes
        href: notes/index.qmd
      - text: About
        href: about/index.qmd
      - text: Join
        href: join/index.qmd
    right:
      - icon: github
        href: https://github.com/uribo
        aria-label: GitHub
  page-footer:
    left: |
      Shinya Uryu — Center for Design-Oriented AI Education and Research, Tokushima University
    right: |
      Built with [Quarto](https://quarto.org)

format:
  html:
    theme:
      - default
      - styles/theme.scss
    toc: true
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
